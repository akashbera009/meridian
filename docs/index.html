<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERIDIAN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0e0f'/%3E%3Ctext x='7' y='45' font-family='monospace' font-weight='bold' font-size='36' fill='%233fb950'%3E$_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header id="top">
  <div class="brand">
    <span class="prompt" id="brand-prompt">~/meridian $</span>
    <span class="title" id="brand-title">MERIDIAN</span>
    <span class="sub" id="sub">loading…</span>
  </div>
  <div class="hud">
    <div class="hud-item"><label>PROGRESS</label><span id="hud-progress">--</span></div>
    <div class="hud-item"><label>WEEK</label><span id="hud-week">--</span></div>
    <div class="hud-item"><label>PACE</label><span id="hud-pace">--</span></div>
    <div class="hud-item"><label>LOGGED</label><span id="hud-hours">--</span></div>
    <button id="btn-weeks" class="btn mobile-only" title="Show week list">☰ weeks</button>
    <button id="btn-notes" class="btn" title="Every note, answer and shipped link in one place">⌕ notebook</button>
    <button id="btn-account" class="btn" title="Sync status">⇅ <span id="sync-label">local</span></button>
  </div>
  <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
</header>

<div id="layout">
  <nav id="sidebar">
    <div class="side-head">
      <button class="btn btn-sm" id="btn-jump">» today</button>
      <label class="chk-inline"><input type="checkbox" id="hide-done"> hide done</label>
    </div>
    <div id="week-list"></div>
  </nav>

  <main id="main">
    <div id="tonight"></div>
    <div id="pane">
      <p class="dim">$ loading curriculum …</p>
    </div>
  </main>

  <!-- On wide screens the timer is relocated here by JS and sticks while
       you scroll; below 1200px it stays inline in the pane. -->
  <aside id="rail"></aside>
</div>

<div id="editor" class="modal hidden">
  <div class="ed-box">
    <div class="ed-head">
      <span class="prompt">$ vi</span>
      <span class="ed-title" id="ed-title"></span>
      <button class="btn btn-sm" id="ed-close">esc</button>
    </div>
    <div class="ed-tools" id="ed-tools">
      <button class="tb" data-w="**|**"   title="Bold · ⌘B"><b>B</b></button>
      <button class="tb" data-w="*|*"     title="Italic · ⌘I"><i>I</i></button>
      <button class="tb" data-w="`|`"     title="Inline code">&lt;/&gt;</button>
      <button class="tb" data-w="```\n|\n```" title="Code block">▤</button>
      <button class="tb" data-p="## "     title="Heading">H</button>
      <button class="tb" data-p="- "      title="Bullet list">•</button>
      <button class="tb" data-p="&gt; "   title="Quote">❝</button>
      <button class="tb" data-link="1"    title="Link · ⌘K">🔗</button>
      <span class="ed-spacer"></span>
      <button class="btn btn-sm" id="ed-split">preview</button>
    </div>
    <div class="ed-body" id="ed-body">
      <textarea id="ed-text" spellcheck="false" placeholder="markdown — ⌘B bold, ⌘I italic, ⌘K link"></textarea>
      <div class="ed-prev" id="ed-prev"></div>
    </div>
    <div class="ed-foot">
      <span id="ed-status" class="dim">autosaved</span>
      <span id="ed-count" class="dim"></span>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="assets/app.js"></script>
<script type="module" src="firebase.js"></script>
</body>
</html>
